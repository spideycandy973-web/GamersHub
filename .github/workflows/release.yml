name: Build & Release APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare release keystore
        run: |
          if [ -f keystore/gamershub.p12 ]; then
            # Normalise the committed PKCS12 into a JKS with the standard alias so
            # every release after this one is signed with the SAME certificate
            # (in-place updates keep the Shizuku grant and all app data).
            keytool -importkeystore -noprompt \
              -srckeystore keystore/gamershub.p12 -srcstoretype PKCS12 \
              -srcstorepass gamershub -srcalias gamershub \
              -destkeystore gamershub.jks -deststoretype JKS \
              -deststorepass gamershub -destkeypass gamershub -destalias gamershub
          else
            keytool -genkeypair -v \
              -keystore gamershub.jks -keyalg RSA -keysize 2048 -validity 10000 \
              -alias gamershub -storepass gamershub -keypass gamershub \
              -dname "CN=GamersHub, OU=App, O=GamersHub, C=US"
          fi

      - name: Build signed release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$PWD/gamershub.jks" \
            -Pandroid.injected.signing.store.password=gamershub \
            -Pandroid.injected.signing.key.alias=gamershub \
            -Pandroid.injected.signing.key.password=gamershub 2>&1 | tee build.log

      - name: Media audit
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK total: $(stat -c%s "$APK") bytes"
          unzip -l "$APK" | awk 'NR>3 && $4 ~ /\.mp4$/ {print "::warning::MEDIA "$1" "$4}'
          unzip -l "$APK" | awk 'NR>3 && $4 ~ /\.png$/ && $1 > 300000 {print "::warning::BIGPNG "$1" "$4}'
          unzip -l "$APK" | awk 'NR>3 && $4 ~ /mipmap/ {print "::notice::ICON "$1" "$4}'

      - name: Report errors as annotations
        if: failure()
        run: |
          grep -E "(^e: |error:|What went wrong|Could not|FAILURE:|Execution failed|R8:|Missing class)" build.log | head -25 | while IFS= read -r line; do
            echo "::error::${line:0:240}"
          done

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/GamersHub-${GITHUB_REF_NAME:-dev}.apk"
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GamersHub-apk
          path: dist/*.apk

      - name: Create GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true

      - name: Publish nightly (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "GamersHub — latest build"
          prerelease: true
          files: dist/*.apk
