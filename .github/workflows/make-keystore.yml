name: Make release keystore
on:
  workflow_dispatch:
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate stable JKS
        run: |
          keytool -genkeypair -v \
            -keystore gamershub.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias gamershub -storepass gamershub -keypass gamershub \
            -dname "CN=GamersHub, OU=App, O=GamersHub, C=US"
          echo "===BEGIN==="
          base64 -w0 gamershub.jks | fold -w 120
          echo ""
          echo "===END==="
