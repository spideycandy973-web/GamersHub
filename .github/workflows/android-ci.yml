name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Report errors as annotations
        if: failure()
        run: |
          grep -E "(^e: |error:|What went wrong|Could not|FAILURE:|Execution failed)" build.log | head -25 | while IFS= read -r line; do
            echo "::error::${line:0:240}"
          done
          echo "--- last 30 lines ---" >> "$GITHUB_STEP_SUMMARY"
          tail -30 build.log >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gamershub-debug-apk
          path: app/build/outputs/apk/debug/*.apk
